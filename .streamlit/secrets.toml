# Copie este arquivo para .streamlit/secrets.toml (NUNCA envie o secrets.toml ao GitHub).
# No Streamlit Cloud: App > Settings > Secrets, e cole o mesmo conteúdo.

[admin]
usuario = "admin"
# Gere com:  python scripts/gerar_hash_senha.py
senha_hash = "cole aqui a senha gerada"

[app]
# Identificação exigida pelo Nominatim (OpenStreetMap). Coloque um contato real.
nominatim_user_agent = "MESAFARTAI/1.0 (projeto educacional; contato: flavio.santarelli@pro.fecaf.com.br)"
# Cidade/UF usada para melhorar a busca quando o doador digita só o endereço (sem CEP).
contexto_geografico = "Taboão da Serra, SP"
# Em produção, mude para false para não inserir as ONGs fictícias de demonstração.
inserir_ongs_demonstracao = true
